name: Cloudflare nightly refresh

# Remplace le cron nocturne de l'ancien deploy.yml (Netlify).
# Cloudflare Pages rebuild sur TOUT push vers main (intégration Git). Ce workflow
# pousse un commit vide chaque nuit → Cloudflare re-prérende avec les dernières
# données Supabase (frais cartes, articles publiés) SANS Deploy Hook ni secret.
#
# Publier un brouillon (publish-drafts.mjs → git push) déclenche déjà un build ;
# ce workflow ne sert qu'à la fraîcheur quotidienne des données.
#
# Aucun setup requis. Pour désactiver : supprime ce fichier.

on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC chaque nuit
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit vide → déclenche le rebuild Cloudflare
        run: |
          git config user.name "cloudflare-refresh-bot"
          git config user.email "bot@topcryptocards.eu"
          git commit --allow-empty -m "chore: nightly rebuild (refresh Supabase content)"
          git push
