name: Build, prerender & deploy to Cloudflare Pages

# Pipeline de déploiement RÉEL du site (projet Cloudflare Pages "Direct Upload").
# GitHub Actions build + prérende (~1050 pages) puis pousse dist/ via wrangler.
# Se déclenche sur push main, en manuel, et chaque nuit (fraîcheur données Supabase).
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   CLOUDFLARE_API_TOKEN    — Cloudflare → My Profile → API Tokens → Create Token
#                             (template "Edit Cloudflare Workers" ou permission Pages:Edit)
#   CLOUDFLARE_ACCOUNT_ID   — 8fce1e4ded2b348e9dd8f0df6b687221 (visible dans l'URL du dashboard)
#   VITE_SUPABASE_URL       — déjà présent
#   VITE_SUPABASE_ANON_KEY  — déjà présent

on:
  push:
    branches: [main]
    # Les commits d'état SEO (brouillons marqués, logs) ne redéploient pas le site.
    paths-ignore:
      - 'seo/state/**'
      - 'seo/gsc-data/**'
  workflow_dispatch: {}
  schedule:
    # Chaque nuit 03:17 UTC : re-prérende pour refléter les changements Supabase
    # (données cartes, articles publiés) sans push de code.
    - cron: '17 3 * * *'

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Hors package.json volontairement : l'environnement Bolt ne peut pas installer
      # puppeteer. --no-save laisse le lockfile intact.
      - name: Install puppeteer (CI only)
        run: npm i --no-save puppeteer

      - name: Regenerate sitemap-blog.xml (fetch live post list from Supabase)
        run: node scripts/generate-sitemap-blog.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build
        run: npx vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Prerender (~1,050 URLs; noindex compare pages are skipped)
        run: node scripts/prerender.mjs
        env:
          PRERENDER_CONCURRENCY: 10

      - name: Sanity-check prerender output
        run: |
          test -f dist/fr.html || (echo "::error::dist/fr.html missing" && exit 1)
          test -f dist/404.html || (echo "::error::dist/404.html missing" && exit 1)
          grep -q 'lang="fr"' dist/fr.html || (echo "::error::/fr lang not fr" && exit 1)
          grep -q '404' dist/_redirects || (echo "::error::_redirects missing real-404 rule" && exit 1)
          grep -q 'Meilleure Carte' dist/fr.html || (echo "::error::FR title still English — waitForFunction did not capture React output" && exit 1)
          grep -q 'Krypto' dist/de.html || (echo "::error::DE title still English — waitForFunction did not capture React output" && exit 1)
          echo "--- dist/fr.html <title>:"
          grep -o '<title>[^<]*</title>' dist/fr.html || echo "(no title found)"
          echo "--- Prerendered pages: $(find dist -name '*.html' ! -name 'index.html' ! -name '404.html' | wc -l)"

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=topcryptocards --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ping IndexNow (notify Bing of updated URLs)
        run: node scripts/indexnow.mjs
